<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- outward circuit leads -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="150" y1="35" x2="150" y2="17"/>
    <line x1="249.6" y1="92.5" x2="265.2" y2="83.5"/>
    <line x1="249.6" y1="207.5" x2="265.2" y2="216.5"/>
    <line x1="150" y1="265" x2="150" y2="283"/>
    <line x1="50.4" y1="207.5" x2="34.8" y2="216.5"/>
    <line x1="50.4" y1="92.5" x2="34.8" y2="83.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="150" cy="17" r="4"/>
    <circle cx="265.2" cy="83.5" r="4"/>
    <circle cx="265.2" cy="216.5" r="4"/>
    <circle cx="150" cy="283" r="4"/>
    <circle cx="34.8" cy="216.5" r="4"/>
    <circle cx="34.8" cy="83.5" r="4"/>
  </g>

  <!-- hexagon frame -->
  <polygon points="150,35 249.6,92.5 249.6,207.5 150,265 50.4,207.5 50.4,92.5"
           fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>

  <!-- inner network mark -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="112" x2="150" y2="158"/>
    <line x1="108" y1="186" x2="150" y2="158"/>
    <line x1="192" y1="186" x2="150" y2="158"/>
  </g>
  <g fill="#ffffff">
    <circle cx="150" cy="112" r="13"/>
    <circle cx="108" cy="186" r="13"/>
    <circle cx="192" cy="186" r="13"/>
    <circle cx="150" cy="158" r="9"/>
  </g>
</svg>
